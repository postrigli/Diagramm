name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Yandex OAuth client id (not a secret): set it under Settings > Secrets and variables > Actions > Variables.
      # Empty is fine - the Yandex Disk button then stays disabled in the app.
      YANDEX_CLIENT_ID: ${{ vars.YANDEX_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Pure Kotlin modules + the Android app (the runner image ships an Android SDK, so :app is included).
      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diagramm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
